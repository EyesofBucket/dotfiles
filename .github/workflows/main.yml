name: CI
on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
#        with:
#          severity: error
#          ignore_paths: dotfiles

      - name: Luacheck linter
        uses: lunarmodules/luacheck@v1
