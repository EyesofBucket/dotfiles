name: CI
on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./dotfiles/.zshrc.d
          additional_files: ./dotfiles/.zshrc
          SHELLCHECK_OPTS: -e SC2148
          check_together: 'yes'
          format: tty

      - name: ShellCheck
        if: always()
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: >-
            ./dotfiles/.zshrc.d
            ./dotfiles/.zshrc
          check_together: 'yes'
          format: tty

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Luacheck linter
        uses: lunarmodules/luacheck@v1
        with:
          args: ". --codes -i 11./vim"
