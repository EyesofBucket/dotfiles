name: CI
on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          format: tty
          check_together: 'yes'

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Luacheck linter
        uses: lunarmodules/luacheck@v1
        with:
          args: . -i "mutating non-standard global variable vim" "accessing undefined variable vim"
