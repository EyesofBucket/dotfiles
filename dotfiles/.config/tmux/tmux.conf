# My precious, beautiful "theme" that's not actually determining any exact colors

set -g status-left ''

set-window-option -g window-status-style bg=default
set-window-option -g window-status-style fg=white
set-window-option -g window-status-style none
set-window-option -g window-status-format '#[fg=black,bg=blue] #I #[fg=default,bg=black] #W #[default]'

set-window-option -g window-status-current-style none
set-window-option -g window-status-current-format '#[fg=black,bg=yellow] #I #[fg=white,bg=black] #W #[default]'

set -g status-right-length 100
set -g status-right-style fg=black

set -g status-right-style bold
set -g status-right '#[fg=black,bg=cyan]  #[fg=default,bg=black] #{session_name} '

set -g pane-border-style bg=default
set -g pane-border-style fg=black
set -g pane-active-border-style bg=default
set -g pane-active-border-style fg="yellow"

set -g status-style bg=default

set -g clock-mode-colour "white"
set -g clock-mode-style 24

# End my beloved pseudo-theme

